name: Update profile artwork

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Generate contribution artwork
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions-light.svg?palette=github-light&color_snake=%23087f83
            assets/contributions-dark.svg?palette=github-dark&color_snake=%236ed8cb

      - name: Validate generated artwork
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for name in ('light', 'dark'):
              path = Path(f'assets/contributions-{name}.svg')
              root = ET.parse(path).getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', path
              assert len(root) > 0, path
          PY

      - name: Publish changed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/contributions-light.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then
            echo 'Artwork is already up to date.'
            exit 0
          fi
          git commit -m 'Refresh contribution artwork'
          git pull --rebase origin main
          git push origin HEAD:main
